<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1226" />
      <stop offset="50%" stop-color="#070c1e" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Emerald / Cyan Shield Stroke -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- S Curve Gradient -->
    <linearGradient id="sCurveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Ambient Radial Glow -->
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full Bleed Edge-to-Edge Solid Background (Zero White Borders on Android & iOS) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circle -->
  <circle cx="256" cy="220" r="180" fill="url(#glow)" />

  <!-- Concentric Tech Precision Rings -->
  <circle cx="256" cy="220" r="190" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.15" />
  <circle cx="256" cy="220" r="160" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.12" />
  <circle cx="256" cy="220" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="4 6" />

  <!-- Central Shield / Vault (Filtered for 3D depth) -->
  <g filter="url(#shadow)">
    <!-- Shield Glass Fill -->
    <polygon points="256,95 370,140 355,260 256,340 157,260 142,140" fill="#0f172a" fill-opacity="0.88" />
    
    <!-- Shield Perimeter Stroke -->
    <polygon points="256,95 370,140 355,260 256,340 157,260 142,140" fill="none" stroke="url(#shieldGrad)" stroke-width="8" stroke-linejoin="round" />

    <!-- Currency Spine Line -->
    <line x1="256" y1="120" x2="256" y2="315" stroke="#ffffff" stroke-width="4" stroke-opacity="0.85" stroke-linecap="round" />

    <!-- Dynamic S-Curve Knot -->
    <path d="M 230 145 C 290 135, 320 160, 316 190 C 312 225, 200 235, 196 270 C 192 305, 230 315, 280 305" 
          fill="none" stroke="url(#sCurveGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Sparkling Core Nodes -->
    <circle cx="316" cy="150" r="9" fill="#38bdf8" />
    <circle cx="196" cy="290" r="9" fill="#34d399" />
  </g>

  <!-- saveCH Typography -->
  <g id="brand-text">
    <text x="256" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="1">
      <tspan fill="#ffffff">save</tspan><tspan fill="#34d399">CH</tspan>
    </text>
    <rect x="226" y="426" width="60" height="4" rx="2" fill="#6366f1" fill-opacity="0.8" />
  </g>
</svg>
