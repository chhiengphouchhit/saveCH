<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Subtle ambient inner glow circle -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" />

  <!-- Shield / Wallet Outline -->
  <g filter="url(#shadow)">
    <!-- Stylized 'S' and 'CH' curves forming a sleek vault/shield icon -->
    <path d="M160 180 C 160 150, 190 140, 240 140 L 272 140 C 330 140, 352 165, 352 200 C 352 230, 328 245, 280 256 L 232 266 C 190 275, 176 290, 176 320 C 176 355, 204 372, 260 372 L 284 372 C 334 372, 356 355, 356 328" 
          fill="none" stroke="url(#accentGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Vault Core Pill -->
    <circle cx="340" cy="200" r="14" fill="#38bdf8" />
    <circle cx="172" cy="320" r="14" fill="#a855f7" />
  </g>
</svg>
